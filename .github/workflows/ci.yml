name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      # синтаксические ошибки и неопределённые имена
      - run: ruff check --select E9,F63,F7,F82 --output-format github .
      - run: python -c "import app.main"
        env:
          DATA_DIR: ${{ runner.temp }}/data

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oracle-vm-creator:ci .
